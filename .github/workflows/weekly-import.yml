# Weekly: find Rabbi Sebrow's new "Delving into the Daf" column in The Jewish Home
# (Issuu), publish it to the site, and open a GitHub issue (which emails you) if
# anything needs a person. See scripts/import/README.md.
name: Weekly newspaper import

on:
  schedule:
    # The issue is usually uploaded Wednesday evening.
    - cron: '0 15 * * 4'   # Thursday 11am New York (10am in winter)
    - cron: '0 15 * * 5'   # Friday: second try, and alert if there's still no column
  workflow_dispatch: {}     # "Run workflow" button for a manual run

permissions:
  contents: read
  issues: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Import and publish
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ "$(date -u +%u)" = "5" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            npm run import:weekly -- --final
          else
            npm run import:weekly
          fi

      - name: Keep the staged files for 30 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-${{ github.run_id }}
          path: data/import/
          retention-days: 30
          if-no-files-found: ignore

      - name: Email an alert (GitHub issue) if something needs a look
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f data/import/alert.md ] && [ "${{ job.status }}" = "success" ]; then exit 0; fi
          if [ ! -f data/import/alert.md ]; then
            echo "The weekly import crashed before it could finish. See the run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > data/import/alert.md
          fi
          echo "" >> data/import/alert.md
          echo "Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> data/import/alert.md
          gh label create import-alert --color D93F0B --description "Weekly newspaper import needs a look" 2>/dev/null || true
          gh issue create \
            --title "Newspaper import needs a look ($(date -u +%Y-%m-%d))" \
            --body-file data/import/alert.md \
            --label import-alert \
            --assignee "${{ github.repository_owner }}"
